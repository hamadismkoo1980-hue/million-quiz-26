<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الأكواد</title><style>body{font-family:Segoe UI,Tahoma,Arial;background:#050a1d;color:#fff;max-width:560px;margin:40px auto;padding:20px}.card{background:#0d1738;border:1px solid #2c438b;border-radius:18px;padding:22px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:12px;font:inherit}input{background:#050b22;color:#fff;border:1px solid #334b90}button{background:#1d4ed8;color:#fff;border:0;font-weight:800;cursor:pointer}pre{background:#040813;padding:14px;border-radius:12px;color:#ffd34d}</style><div class="card"><h1>🔐 إدارة الأكواد</h1><input id="secret" type="password" placeholder="ADMIN_SECRET"><input id="attempts" type="number" min="1" max="10" value="1"><button onclick="make()">إنشاء كود دخول</button><pre id="out">—</pre></div><script>async function make(){const r=await fetch("/api/admin-voucher",{method:"POST",headers:{"content-type":"application/json","x-admin-secret":document.getElementById("secret").value},body:JSON.stringify({attempts:Number(document.getElementById("attempts").value)})}).then(x=>x.json());document.getElementById("out").textContent=r.ok?`الكود: ${r.code}\nالمحاولات: ${r.attempts}`:(r.message||"خطأ")}</script>
